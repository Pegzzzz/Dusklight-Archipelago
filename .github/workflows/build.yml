name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.3.4
  # Archipelago release the APWorld and the client are tested against
  ARCHIPELAGO_VERSION: "0.6.8"

jobs:
  build:
    name: Build ${{matrix.platform}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: ios-arm64
            runner: macos-latest
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64
          - platform: windows-arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
          - platform: android-aarch64
            runner: ubuntu-latest
            android_ndk: "29.0.14206865"

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Annotations are readable without signing in, unlike the logs
          if [ -f build.log ]; then
            msg=$(grep -iE "error|undefined|fatal" build.log | head -n 40 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')
            echo "::error title=Build errors::$msg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  apworld:
    name: APWorld
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out Archipelago
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{env.ARCHIPELAGO_VERSION}}
          path: archipelago

      - name: Install Archipelago
        run: |
          tools/ci/prepare_archipelago.sh archipelago .
          python -m pip install -r archipelago/requirements.txt pytest

      - name: Test the world
        working-directory: archipelago
        run: python -m pytest -q worlds/tp_dusklight/test test/general

      - name: Package
        run: python apworld/tools/package_apworld.py -o dist/tp_dusklight.apworld

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apworld
          path: dist/tp_dusklight.apworld
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out Archipelago
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{env.ARCHIPELAGO_VERSION}}
          path: archipelago

      - name: Install Archipelago
        run: |
          tools/ci/prepare_archipelago.sh archipelago .
          python -m pip install -r archipelago/requirements.txt

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Build test tools
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel --target ap_parity_harness ap_tool ap_seeddata_test ap_client_driver

      - name: Logic parity (Python port vs. C++ generator)
        env:
          PYTHONPATH: archipelago
        run: |
          set -o pipefail
          python apworld/tools/parity_test.py --harness build/ap_parity_harness --samples 100 \
            --random-presets 40 2>&1 | tee parity_test.log

      - name: Slot data to in-game seed
        run: |
          set -o pipefail
          cd archipelago
          python ../apworld/tools/seed_test.py --ap-tool ../build/ap_tool \
            --seeddata-test ../build/ap_seeddata_test --count 8 2>&1 | tee ../seed_test.log

      - name: Network client against MultiServer
        run: |
          set -o pipefail
          python apworld/tools/client_test.py archipelago build/ap_client_driver 2>&1 | tee client_test.log

      - name: Report test failures
        if: failure()
        run: |
          # Annotations are readable without signing in, unlike the logs
          for log in parity_test.log seed_test.log client_test.log; do
            [ -f "$log" ] || continue
            msg=$(grep -vE "^ *(File|\^|~)|Could not load world|UserWarning|warnings.warn" "$log" | tail -n 40 \
              | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')
            echo "::error title=$log::$msg"
          done

  combine:
    name: Combine bundles
    needs: [build, apworld, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Download APWorld
        uses: actions/download-artifact@v8
        with:
          name: apworld
          path: dist/apworld

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/mod-*/*.dusk
          cp dist/apworld/tp_dusklight.apworld combined/

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            combined/*.dusk
            combined/*.apworld
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "$GITHUB_REF_NAME" combined/*.dusk combined/*.apworld --verify-tag --generate-notes
